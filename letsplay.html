<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Pacman</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101111;
      color: #f1f1e9;
      font-family: "Press Start 2P", monospace;
    }

    [hidden] {
      display: none !important;
    }

    .welcome {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #ffff00;
      font-size: clamp(24px, 5vw, 48px);
      line-height: 1.6;
    }

    p {
      color: #a5aaa6;
      font-size: 12px;
      line-height: 2;
    }

    .pacman {
      width: 64px;
      height: 64px;
      background: #ffff00;
      border-radius: 50%;
      animation: chomp 0.5s steps(2, end) infinite;
    }

    @keyframes chomp {
      0%, 100% {
        clip-path: polygon(
          0 0, 100% 0, 100% 20%,
          50% 50%, 100% 80%, 100% 100%, 0 100%
        );
      }

      50% {
        clip-path: polygon(
          0 0, 100% 0, 100% 45%,
          50% 50%, 100% 55%, 100% 100%, 0 100%
        );
      }
    }

    button {
      padding: 18px 24px;
      background: #191b1b;
      color: #f5ed63;
      border: 1px solid #f5ed63;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #f5ed63;
      color: #101111;
    }

    button:focus-visible {
      outline: 3px solid #f5ed63;
      outline-offset: 6px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #101111;
    }

    @media (prefers-reduced-motion: reduce) {
      .pacman {
        animation: none;
      }
    }
    .welcome-animation {
  position: relative;
  width: min(320px, 80vw);
  height: 80px;
  overflow: hidden;
}

.pellets {
  position: absolute;
  top: 36px;
  left: 0;
  width: 100%;
  height: 8px;
  background: radial-gradient(
    circle,
    #f1f1e9 3px,
    transparent 4px
  ) 0 0 / 32px 8px repeat-x;
}

.moving-pacman {
  position: absolute;
  top: 8px;
  left: -64px;
  animation: travel 3s linear infinite;
}

.pacman {
  width: 64px;
  height: 64px;
  background: #ffff00;
  border-radius: 50%;
  animation: chomp 0.3s steps(2, end) infinite;
}

@keyframes travel {
  from {
    left: -64px;
  }

  to {
    left: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .moving-pacman {
    animation: none;
    left: calc(50% - 32px);
  }

  .pacman {
    animation: none;
  }
}
  </style>
</head>

<body>
  <section id="welcome" class="welcome">
    <div class="welcome-animation" aria-hidden="true">
  <div class="pellets"></div>
  <div class="moving-pacman">
    <div class="pacman"></div>
  </div>
</div>

    <h1>Welcome to<br>Pacman.</h1>

    <p>The maze is waiting.</p>

    <button id="play" type="button" disabled>
      Loading…
    </button>
  </section>

  <iframe
    id="game"
    src="index.html"
    title="Pacman game"
    allow="autoplay"
    hidden
  ></iframe>

  <script>
    const playButton = document.querySelector('#play');
    const welcome = document.querySelector('#welcome');
    const game = document.querySelector('#game');

    game.addEventListener('load', () => {
      playButton.disabled = false;
      playButton.textContent = "Let's Play →";
    });

    playButton.addEventListener('click', () => {
      const gameDocument = game.contentDocument;
      const music = gameDocument.querySelector('#menu-music');

      // Start music directly from this user click.
      if (music) {
        music.play().catch(error => {
          console.debug('Music could not start:', error);
        });
      }

      // Activate the existing menu music logic in app.js.
      gameDocument.dispatchEvent(
        new game.contentWindow.MouseEvent('click', {
          bubbles: true
        })
      );

      welcome.hidden = true;
      game.hidden = false;
      game.contentWindow.focus();
    });
  </script>
</body>
</html>
