<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Pacman</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="welcome" class="welcome">
    <div class="welcome-animation" aria-hidden="true">
      <div class="pellets"></div>
      <div class="moving-pacman"><span class="welcome-pacman"></span></div>
    </div>

    <h1>Welcome to<br>Pacman.</h1>

    <p>The maze is waiting.</p>

    <button id="play" class="play-button" type="button" disabled>
      Loading…
    </button>
  </main>

  <iframe
    id="game"
    src="game.html"
    title="Pacman game"
    allow="autoplay"
    hidden
  ></iframe>

  <script>
    const playButton = document.querySelector('#play');
    const welcome = document.querySelector('#welcome');
    const game = document.querySelector('#game');

    game.addEventListener('load', () => {
      playButton.disabled = false;
      playButton.textContent = "Let's Play →";
    });

    playButton.addEventListener('click', () => {
      const gameDocument = game.contentDocument;
      const music = gameDocument.querySelector('#menu-music');

      // Start music directly from this user click.
      if (music) {
        music.play().catch(error => {
          console.debug('Music could not start:', error);
        });
      }

      // Activate the existing menu music logic in app.js.
      gameDocument.dispatchEvent(
        new game.contentWindow.MouseEvent('click', {
          bubbles: true
        })
      );

      welcome.hidden = true;
      game.hidden = false;
      game.contentWindow.focus();
    });
  </script>
</body>
</html>
